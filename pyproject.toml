[project]
name = "commentguard"
version = "0.1.0"
description = "한국어 댓글 악플 판정 API (클라우드 MLOps 실습과제)"
requires-python = ">=3.11,<3.13"  # 로컬 3.11, Vercel 함수 3.12
license = { text = "MIT" }
# Vercel은 이 목록으로 함수 의존성을 설치합니다 (함수가 처음 뜰 때 /tmp에 설치되므로 서빙에 필요한 것만).
# 버전은 requirements.txt와 같아야 합니다 (tests/test_packaging.py). 학습·평가 의존성은 requirements*.txt로 설치합니다.
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "click==8.5.1",
    "fastapi==0.162.2",
    "filelock==4.2.12",
    "flatbuffers==25.12.19",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.8.0",
    "httpcore2==2.16.2",
    "httpx2==2.16.2",
    "huggingface_hub==2.4.0",
    "idna==3.20",
    "numpy==2.4.6",
    "onnxruntime==1.32.0",
    "opentelemetry-api==1.45.2",
    "packaging==26.3",
    "protobuf==7.36.2",
    "pydantic==2.14.3",
    "pydantic_core==2.50.4",
    "PyYAML==6.0.3",
    "starlette==1.10.0",
    "tokenizers==0.23.3",
    "tqdm==4.70.1",
    "truststore==0.10.5",
    "typing-inspection==0.4.5",
    "typing_extensions==4.16.0",
    "vercel-blob==0.6.2",
    "vercel-headers==0.8.0",
    "vercel-internal-core==0.3.2",
    "vercel-oidc==0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
