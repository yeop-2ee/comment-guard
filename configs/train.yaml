# 학습 설정. eval(dev.tsv)은 여기 어떤 값을 정하는 데에도 쓰지 않습니다.
seed: 42
split:
  valid_size: 0.1          # train.tsv 안에서 층화 분할
  stratify_on: hate

m1:
  tfidf:
    analyzer: char_wb
    ngram_range: [2, 5]
    min_df: 2
    sublinear_tf: true
    max_features: 200000
  logreg:
    class_weight: balanced
    max_iter: 2000
  C_grid: [0.25, 0.5, 1, 2, 4]   # valid macro-F1로 선택

evaluation:
  bootstrap_iters: 1000
  bootstrap_seed: 42
